<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- tailwind link -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- daisyUi link -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Legal Solution</title>
    <link rel="shortcut icon" href="./images/address.png" type="image/x-icon" />

    <!-- style -->
    <style>
      .font-poppins {
        font-family: "Poppins", serif;
      }
      .bg-legal-gradient {
        background: linear-gradient(
          180deg,
          rgb(243, 243, 243),
          rgba(243, 243, 243, 0) 100%
        );
      }
      .font-eb-garamond {
        font-family: "EB Garamond", serif;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              clifford: "#da373d",
              "legal-primary": "#B68C5A",
              "legal-primary-bg": "rgba(17, 17, 17, 0)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="font-poppins">
    <header class="container max-w-[1280px] mx-auto">
      <!-- start navbar -->
      <nav class="my-4">
        <div class="navbar bg-base-100">
          <div class="navbar-start">
            <div class="dropdown">
              <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h8m-8 6h16"
                  />
                </svg>
              </div>
              <ul
                tabindex="0"
                class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52"
              >
                <li><a>Home</a></li>
                <li><a>Service</a></li>
                <li><a>Cases</a></li>
                <li><a>Blog</a></li>
                <li><a>Contact Us</a></li>
              </ul>
            </div>
            <div class="logo flex gap-4">
              <img class="w-8 md:w-10" src="./images/business.png" alt="" />
              <a
                class="text-2xl md:text-4xl font-semibold md:font-bold font-eb-garamond"
                >Justice</a
              >
            </div>
          </div>
          <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1">
              <li><a>Home</a></li>
              <li><a>Service</a></li>
              <li><a>Cases</a></li>
              <li><a>Blog</a></li>
              <li><a>Contact Us</a></li>
            </ul>
          </div>
          <div class="navbar-end">
            <a
              class="btn bg-legal-primary text-white hover:bg-white hover:text-black"
              >Free Consultation</a
            >
          </div>
        </div>
      </nav>

      <!-- start hero section -->
      <!-- banner section  -->
      <section>
        <div
          class="hero md:h-[550px] rounded"
          style="
            background: linear-gradient(
                0deg,
                rgb(17, 17, 17),
                rgba(17, 17, 17, 0) 100%
              ),
              url(./images/banner.png);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
          "
        >
          <div class="hero-overlay bg-opacity-[0.07]"></div>
          <div class="hero-content text-center text-white">
            <div class="max-w-xl">
              <h1 class="mb-5 text-4xl sm:text-6xl font-bold font-eb-garamond">
                We Provide Effective Legal Solutions
              </h1>
              <p class="mb-5 text-[#E7E7E7]">
                There are many variations of passages of Lorem Ipsum available,
                but the majority have suffered alteration in some form.
              </p>
              <input
                type="email"
                placeholder="Search your services"
                class="input input-bordered w-full max-w-sm text-[#A0A0A0] text-[14px] sm:me-3 mb-3 sm:mb-0"
              />
              <button
                class="btn bg-legal-primary px-7 text-white border-none hover:bg-white hover:text-[#474545]"
              >
                Search
              </button>
            </div>
          </div>
        </div>
      </section>
    </header>


  </body>
</html>
